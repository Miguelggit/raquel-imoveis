spring:
  datasource:
    url: jdbc:mysql://localhost:3307/raquel_imoveis_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:${MYSQL_USER:raquel}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:db_msql_raquel}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

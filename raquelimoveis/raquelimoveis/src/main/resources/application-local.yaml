spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_HOST_PORT:3307}}/${DB_NAME:${MYSQL_DATABASE:raquel_imoveis}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:${MYSQL_USER:raquel}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:db_msql_raquel}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never
